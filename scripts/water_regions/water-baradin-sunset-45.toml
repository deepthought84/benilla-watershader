# wg-baradin-sunset-45: Baradin Bay at 19:40 facing the sun's 45° bearing, the sun above the
# ridge, the glint path below it; the horizon at y 490. Flake: x1500-1565 y695-730 lands in one
# of two states.
scene = "water-baradin-sunset-45"
[box]
glint = [500, 500, 1100, 900]
far_water = [0, 492, 400, 510]
sky = [0, 380, 400, 470]
water = [0, 650, 450, 900]
sky_water_a = [0, 480, 380, 590]
sky_water_b = [1000, 760, 1550, 900]
[[row]]
metric = "glint_peak"
box = "glint"
[[row]]
metric = "glint_width"
box = "glint"
[[row]]
metric = "horizon_ratio"
water = "far_water"
sky = "sky"
[[row]]
metric = "deep_hue"
label = "sunset_hue"
box = "water"
[[row]]
metric = "lum_vs_ref"
box = "water"
# The sky floor against the mirror where both see open sky (R-C3): the floor-served still
# (WOW_PROBE=0 WOW_NO_REFLECT=1) as ~floor, its FLOOR_OCC view as ~floor@floor_occ and the shipped
# TIERS view, inside boxes where the mirror shows only the dome and its clouds.
[[row]]
metric = "tier_consistency"
box = ["sky_water_a", "sky_water_b"]
