# wg-crystal-3p-noon: Crystal Lake from a third-person camera, 11.5° down: murloc huts on the far
# strip (waterline y 380-400), reeds and the near bank along the bottom. Burst rows read a 2 s
# static burst.
scene = "water-crystal-3p-noon"
[box]
hut = [1150, 335, 1205, 360]         # a hut's roof on the far strip; its legs meet the water at y 430
grass = [1000, 250, 1100, 280]       # the grass behind it
hut_refl = [1145, 503, 1180, 523]    # the roof's reflection, a faint warm patch below the legs
grass_refl = [1080, 503, 1130, 523]  # the water beside it, the same rows
water = [100, 480, 1500, 680]
near_bank = [400, 700, 1600, 800]
# P1-30's objective (R-E4): softer than the baseline's mirror, never washed out.
[[row]]
metric = "refl_contrast"
object = "hut"
sky = "grass"
object_refl = "hut_refl"
sky_refl = "grass_refl"
within = [0.6, 1.0]
[[row]]
metric = "luma_sd"
box = "water"
[[row]]
metric = "lum_vs_ref"
box = "water"
[[row]]
metric = "contact_cov"
label = "collar_cov"
box = "near_bank"
[[row]]
metric = "frame_std"
label = "water_frame_std"
box = "water"
[[row]]
metric = "shimmer"
box = "water"
# The bands (P1-27) against the albedo view with the bands off, ~unbanded@albedo: what they add
# to the scene's own edges (R-E3).
[[row]]
metric = "band_step"
box = "water"
# P1-27 holds the deep hue within 10° of the albedo view; judged at P1-35 (R-E3).
[[row]]
metric = "deep_hue"
box = "water"
defer = "P1-35: the interim E = dec(lit) carries the light's colour into the body (R-E3)"
