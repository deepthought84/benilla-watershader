# wg-loch-rain: water-loch-modan's camera in heavy rain (grade 0.8): the storm sky and fog hide the
# island; the lake's far edge meets the fog band at y 455-462 (the far box holds it; its rows read
# each column's own waterline, traced from the Fresnel and foam views).
# Flake: water-loch-modan's lake-bed patch at x815-837 y701-720, so the water box stops above it.
scene = "water-loch-rain"
[box]
water = [0, 520, 1600, 690]
far = [0, 430, 1600, 500]
[[row]]
metric = "horizon_step"
box = "far"
[[row]]
metric = "far_over_land"
box = "far"
[[row]]
metric = "luma_sd"
box = "water"
[[row]]
metric = "lum_vs_ref"
box = "water"
