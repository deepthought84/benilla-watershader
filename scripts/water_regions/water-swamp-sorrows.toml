# wg-swamp-sorrows: murky swamp water in the Swamp of Sorrows under an orange fog; the far water
# fades into the fog at y 463-480 (steepest between rows 468 and 469, x 550-850). Flake: x360-390
# y460-476 moves by up to 3 codes run to run.
scene = "water-swamp-sorrows"
[box]
water = [400, 600, 1100, 850]
far = [550, 460, 850, 480]
# P1-27 holds the deep hue within 10° of the albedo view; judged at P1-35 (R-E3).
[[row]]
metric = "deep_hue"
box = "water"
defer = "P1-35: the interim E = dec(lit) carries the light's colour into the body (R-E3)"
[[row]]
metric = "deep_luma"
box = "water"
[[row]]
metric = "deep_chroma"
box = "water"
[[row]]
metric = "horizon_step"
box = "far"
water_y = 469
sky_y = 468
[[row]]
metric = "lum_vs_ref"
box = "water"
# The bands (P1-27) against the albedo view with the bands off, ~unbanded@albedo: what they add
# to the scene's own edges (R-E3).
[[row]]
metric = "band_step"
box = "water"
