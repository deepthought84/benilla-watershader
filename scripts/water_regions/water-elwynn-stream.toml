# wg-elwynn-stream: water-noon's camera, the Elwynn water in the trees' shade, a murloc camp on the
# far bank (waterline y 480-500). Burst rows read a 2 s static burst.
scene = "water-elwynn-stream"
[box]
water = [300, 520, 1300, 850]
far_edge = [500, 380, 1500, 480]     # the far water under the canopy's edge
[[row]]
metric = "luma_sd"
box = "water"
[[row]]
metric = "lum_vs_ref"
box = "water"
[[row]]
metric = "frame_std"
label = "water_frame_std"
box = "water"
[[row]]
metric = "frame_std"
label = "canopy_edge_frame_std"
box = "far_edge"
[[row]]
metric = "shimmer"
box = "water"
# The shipped frame's shimmer at the canopy's edge, over the far water the floor occlusion covers.
[[row]]
metric = "shimmer"
label = "canopy_edge_shimmer"
box = "far_edge"
[[row]]
metric = "pop"
box = "water"
# The body's light holds still over a 2 s static burst of its views under the canopy's edge: the
# sky's open share the plane pass traces and the in-scatter (R18, R22).
[[row]]
metric = "view_std"
label = "canopy_edge_sky_vis_std"
view = "sky_vis"
box = "far_edge"
max = 1.0
[[row]]
metric = "view_std"
label = "canopy_edge_in_scatter_std"
view = "in_scatter"
box = "far_edge"
max = 1.0
