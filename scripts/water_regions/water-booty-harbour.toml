# wg-booty-harbour: Booty Bay's harbour from a dock, the open water right of an anvil on the planks,
# stilted houses behind it (their posts' waterline at y 505-530), the dock's plank edge crossing
# the bottom from y 636 at x 1175 to y 730 at x 1575. Every deck in frame lies below the eye, so no
# underside shows: the under-deck gate is water-booty-underdeck's.
scene = "water-booty-harbour"
[box]
water = [1200, 550, 1600, 625]       # open water right of the anvil (x <= 1179), above the planks
harbour = [1340, 585, 1520, 670]     # the harbour body (P1-27's x1340-1520 y585-680, above the planks)
open = [1520, 652, 1600, 712]        # near water right of the pilings' reflections, above the planks
pilings = [1050, 495, 1550, 530]     # the posts' waterline
[[row]]
metric = "contact_cov"
label = "pilings_contact"
box = "pilings"
# The harbour's hue where no piling is mirrored: the open box, F < 0.2 from the Fresnel view. The
# harbour box is mostly the posts' orange reflections (R-E3).
[[row]]
metric = "deep_hue"
label = "harbour_hue"
box = "open"
albedo = false
# The body's own hue on the in-scatter view (variant, P1-27): no reflection in it (R-E3).
[[row]]
metric = "deep_hue"
label = "harbour_body_hue"
box = "harbour"
on = "in_scatter"
albedo = false
fresnel = false
min = 120
[[row]]
metric = "deep_luma"
box = "harbour"
[[row]]
metric = "deep_chroma"
box = "harbour"
[[row]]
metric = "luma_sd"
box = "water"
[[row]]
metric = "lum_vs_ref"
box = "water"
# P1-27 holds the deep hue within 10° of the albedo view, judged under P1-35's light (R-E3).
[[row]]
metric = "deep_hue"
label = "deep_hue"
box = "harbour"
defer = "R-E3: under the body's own light (P1-35) the hue stays more than 10° off the albedo view; the owner judges it"
