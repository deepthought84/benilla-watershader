# wg-booty-harbour: Booty Bay's harbour from a dock, the open water right of an anvil on the planks,
# stilted houses behind it (their posts' waterline at y 505-530), the dock's plank edge crossing
# the bottom from y 636 at x 1175 to y 730 at x 1575. Every deck in frame lies below the eye, so no
# underside shows: the under-deck gate is water-booty-underdeck's.
scene = "water-booty-harbour"
[box]
water = [1200, 550, 1600, 625]       # open water right of the anvil (x <= 1179), above the planks
harbour = [1340, 585, 1520, 670]     # the harbour body (P1-27's x1340-1520 y585-680, above the planks)
pilings = [1050, 495, 1550, 530]     # the posts' waterline
[[row]]
metric = "contact_cov"
label = "pilings_contact"
box = "pilings"
[[row]]
metric = "deep_hue"
label = "harbour_hue"
box = "harbour"
[[row]]
metric = "deep_luma"
box = "harbour"
[[row]]
metric = "deep_chroma"
box = "harbour"
[[row]]
metric = "luma_sd"
box = "water"
[[row]]
metric = "lum_vs_ref"
box = "water"
