# wg-falfarren: the Falfarren River under Ashenvale's canopy, the far bank's hedge above the
# waterline (y 590-610). Flake: the near-left water at x0-571 y611-899 lands in two or three
# states, so the water boxes start right of it; the whole water and the bank, x0-1599 y189-899,
# also lands in two states up to 19 codes apart, and the Reference twin's canopy at x242-276
# y166-214 in two up to 10 apart. Burst rows read a 2 s static burst.
scene = "water-falfarren-river"
[box]
water = [600, 680, 1400, 850]
bank = [200, 450, 1400, 560]
water_wide = [600, 620, 1500, 880]
bank_edge = [600, 590, 1500, 640]       # the water along the far bank's waterline
[[row]]
metric = "water_bank_ratio"
water = "water"
bank = "bank"
[[row]]
metric = "luma_sd"
box = "water"
[[row]]
metric = "lum_vs_ref"
box = "water"
[[row]]
metric = "frame_std"
label = "water_frame_std"
box = "water_wide"
[[row]]
metric = "frame_std"
label = "bank_edge_frame_std"
box = "bank_edge"
[[row]]
metric = "shimmer"
box = "water_wide"
# The shipped frame's shimmer along the far bank, under the canopy's edge.
[[row]]
metric = "shimmer"
label = "bank_edge_shimmer"
box = "bank_edge"
[[row]]
metric = "pulse"
box = "water_wide"
[[row]]
metric = "pop"
box = "water_wide"
# The body's light holds still over a 2 s static burst of its views along the far bank's canopy
# edge (R18). The river lies off the mirror planes, where the body reads the sky and the sun open
# (C10): the sky_vis row is 0 by construction and checks only that rule, and the in-scatter row
# measures the terrain's MCSH and the ripple. The rays' own stillness is Elwynn stream's row.
[[row]]
metric = "view_std"
label = "bank_edge_sky_vis_std"
view = "sky_vis"
box = "bank_edge"
max = 1.0
[[row]]
metric = "view_std"
label = "bank_edge_in_scatter_std"
view = "in_scatter"
box = "bank_edge"
max = 1.0
