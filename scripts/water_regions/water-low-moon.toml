# wg-low-moon: Loch Modan at 02:30 from its south-east shore, facing the white moon at +14.9° on
# its 45° bearing; the moon's path on the lake below it. Flake: the Reference twin's x1464-1482
# y466-482 lands in one of two states.
scene = "water-low-moon"
[box]
moon_path = [500, 520, 1100, 850]
water = [0, 550, 500, 850]
sky_water_a = [0, 780, 640, 900]
sky_water_b = [960, 700, 1260, 900]
[[row]]
metric = "glint_peak"
label = "moon_peak"
box = "moon_path"
[[row]]
metric = "glint_width"
label = "moon_width"
box = "moon_path"
[[row]]
metric = "deep_hue"
label = "night_hue"
box = "water"
defer = "R-E3: under the body's own light (P1-35) the hue stays more than 10° off the albedo view; the owner judges it"
[[row]]
metric = "deep_luma"
box = "water"
[[row]]
metric = "deep_chroma"
box = "water"
[[row]]
metric = "lum_vs_ref"
box = "water"
# The sky floor against the mirror where both see open sky (R-C3): the floor-served still
# (WOW_PROBE=0 WOW_NO_REFLECT=1) as ~floor, its FLOOR_OCC view as ~floor@floor_occ and the shipped
# TIERS view, inside boxes where the mirror shows only the dome and its clouds.
[[row]]
metric = "tier_consistency"
box = ["sky_water_a", "sky_water_b"]
# Night is dark, never black: the darkest water stays above 8 codes (R24).
[[row]]
metric = "luma_p5"
label = "night_floor"
box = "water"
min = 8.0
