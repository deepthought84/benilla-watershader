# wg-felwood-jademir: Jademir Lake in Feralas, murky green-yellow water under fog; the far
# waterline at y 475 on the right (x 1300-1600), where the water meets the fogged bank. Flake:
# lake-bed plants at x1237-1599 y483-608 land in three or more states, and a patch at x750-768
# y233-278 in two, in the shot and its Reference twin alike.
scene = "water-felwood-jademir"
[box]
water = [0, 650, 1600, 900]
far = [1300, 470, 1600, 480]
# P1-27 holds the deep hue within 10° of the albedo view; judged at P1-35 (R-E3).
[[row]]
metric = "deep_hue"
box = "water"
defer = "P1-35: the interim E = dec(lit) carries the light's colour into the body (R-E3)"
[[row]]
metric = "deep_luma"
box = "water"
[[row]]
metric = "deep_chroma"
box = "water"
[[row]]
metric = "horizon_step"
box = "far"
water_y = 475
sky_y = 474
[[row]]
metric = "lum_vs_ref"
box = "water"
