# wg-westfall-noon: the open sea off the Westfall coast at noon, the horizon at y 400, a beach in
# the lower left, shallows along the bottom; the sea reaches the far clip at y 456, where the
# roughness rows' three ROUGHNESS-view columns start.
scene = "water-westfall-noon"
[box]
far_water = [600, 470, 1400, 510]
sky = [600, 360, 1400, 395]
shallows = [700, 800, 1000, 880]
deep = [500, 520, 1600, 640]
wall = [300, 400, 1500, 480]
water = [500, 520, 1600, 900]
rough_a = [790, 458, 810, 900]
rough_b = [1190, 458, 1210, 900]
rough_c = [1490, 458, 1510, 900]
sky_water = [0, 0, 1600, 900]
[[row]]
metric = "horizon_ratio"
water = "far_water"
sky = "sky"
[[row]]
metric = "deep_hue"
label = "shallows_hue"
box = "shallows"
albedo = false
[[row]]
metric = "deep_luma"
box = "deep"
[[row]]
metric = "deep_chroma"
box = "deep"
[[row]]
metric = "zero_band"
box = "wall"
[[row]]
metric = "lum_vs_ref"
box = "water"
# The roughness rises to the far clip with no step over 2% of the unresolved surface's alpha. The
# rise itself (monotone, back) is reported, not gated: phase1.md gates it at Baradin only.
[[row]]
metric = "roughness_profile"
label = "rough_a"
box = "rough_a"
max = 10.8
rising = true
[[row]]
metric = "roughness_profile"
label = "rough_b"
box = "rough_b"
max = 10.8
rising = true
[[row]]
metric = "roughness_profile"
label = "rough_c"
box = "rough_c"
max = 10.8
rising = true
# The sky floor against the mirror where both see open sky (R-C3): the floor-served still
# (WOW_PROBE=0 WOW_NO_REFLECT=1) as ~floor, its FLOOR_OCC view as ~floor@floor_occ and the shipped
# TIERS view, inside boxes where the mirror shows only the dome and its clouds.
[[row]]
metric = "tier_consistency"
box = "sky_water"
# The bands (P1-27) against the albedo view with the bands off, ~unbanded@albedo: what they add
# to the scene's own edges (R-E3).
[[row]]
metric = "band_step"
box = "water"
# P1-27 holds the deep hue within 10° of the albedo view, judged under P1-35's light (R-E3).
[[row]]
metric = "deep_hue"
label = "deep_hue"
box = "deep"
