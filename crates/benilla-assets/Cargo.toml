[package]
name = "benilla-assets"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bevy AssetSource + AssetLoaders over the WoW 1.12.1 MPQ patch chain"

[lints]
workspace = true

[features]
# The dev/player seam, on by default. `benilla-formats` comes in without default features and its
# `dev` is forwarded here, or unification would put it back in a player build.
default = ["dev"]
dev = ["benilla-formats/dev"]

[dependencies]
anyhow.workspace = true
bevy.workspace = true
benilla-formats = { path = "../benilla-formats", default-features = false }
# Nearest-neighbour resize of layer BLPs smaller than `LAYER_TEX_SIZE`: texel replication in gamma
# bytes, with no averaging to darken mid-tones.
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# The WGSL tripwire (`tests/liquid_wgsl_compiles.rs`) composes and validates the liquid shader as
# Bevy does. The versions and features are the ones Bevy's own build already uses, so nothing new
# is compiled into the dependency graph.
# The composite's CPU mirror (`src/liquid_composite.rs`) models a half-float blender.
half = "2.7"
naga = { version = "27", features = ["wgsl-in"] }
naga_oil = { version = "0.20", default-features = false, features = ["test_shader"] }
